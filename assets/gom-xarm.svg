<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GOM Inspect to xArm integration architecture</title>
  <desc id="desc">A measurement moves from GOM Inspect on Windows through XML, TCP and JSON into ROS 1 on Linux, which commands an xArm 5 robot.</desc>
  <rect width="1600" height="900" fill="#f2f1ed"/>
  <path d="M120 160H1480M120 740H1480" stroke="#242729" stroke-width="2"/>
  <text x="120" y="112" fill="#242729" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="5">INSPECT  /  TRANSPORT  /  ACT</text>

  <g transform="translate(140 260)" fill="none" stroke="#242729" stroke-width="12">
    <rect x="0" y="0" width="300" height="190"/>
    <path d="M95 250H205M150 190V250"/>
    <path d="M72 62H228M72 100H190M72 138H215" stroke-width="8"/>
  </g>
  <text x="140" y="600" fill="#242729" font-family="Arial, sans-serif" font-size="42" font-weight="700">GOM Inspect</text>
  <text x="140" y="650" fill="#62676a" font-family="Arial, sans-serif" font-size="28">Windows workstation</text>

  <path d="M490 390H735" stroke="#dd5a32" stroke-width="10"/>
  <path d="M715 365L750 390L715 415" fill="none" stroke="#dd5a32" stroke-width="10"/>
  <text x="515" y="345" fill="#242729" font-family="Arial, sans-serif" font-size="28" font-weight="700">EXPORTED XML</text>

  <g transform="translate(765 265)">
    <path d="M0 0H250V250H0Z" fill="#242729"/>
    <path d="M46 76H204M46 125H204M46 174H204" stroke="#f2f1ed" stroke-width="10"/>
    <circle cx="46" cy="76" r="10" fill="#dd5a32"/>
    <circle cx="204" cy="174" r="10" fill="#dd5a32"/>
  </g>
  <text x="765" y="600" fill="#242729" font-family="Arial, sans-serif" font-size="42" font-weight="700">TCP / JSON</text>
  <text x="765" y="650" fill="#62676a" font-family="Arial, sans-serif" font-size="28">Validated transport</text>

  <path d="M1060 390H1180" stroke="#dd5a32" stroke-width="10"/>
  <path d="M1160 365L1195 390L1160 415" fill="none" stroke="#dd5a32" stroke-width="10"/>

  <g transform="translate(1210 230)" fill="none" stroke="#242729" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M45 320H275"/>
    <path d="M95 320L130 220L215 150L260 55"/>
    <circle cx="130" cy="220" r="25" fill="#f2f1ed"/>
    <circle cx="215" cy="150" r="25" fill="#f2f1ed"/>
    <path d="M260 55L305 25M260 55L305 85"/>
  </g>
  <text x="1210" y="600" fill="#242729" font-family="Arial, sans-serif" font-size="42" font-weight="700">ROS 1 → xArm 5</text>
  <text x="1210" y="650" fill="#62676a" font-family="Arial, sans-serif" font-size="28">Linux robot control</text>
</svg>
